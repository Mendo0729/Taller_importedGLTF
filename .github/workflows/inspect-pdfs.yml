name: Inspect GLTF assignment PDFs
on:
  push:
    branches: [solucion-taller-gltf]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract both PDF documents
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null
          for file in *.pdf; do
            echo "========== PDF START: $file =========="
            pdfinfo "$file" | grep -E "Title:|Pages:|Page size:|File size:"
            pdftotext -layout "$file" - | cat
            echo "========== PDF END: $file =========="
          done
      - name: Render visual deployment guide pages
        shell: bash
        run: |
          sudo apt-get install -y -qq python3-pil >/dev/null
          mkdir -p /tmp/pdfpages
          pdftoppm -jpeg -r 90 "Desplegar-en-TreeJS (1).pdf" /tmp/pdfpages/p >/dev/null 2>&1
          /usr/bin/python3 - <<'PY'
          import glob, base64
          from PIL import Image, ImageOps, ImageDraw
          pages=sorted(glob.glob('/tmp/pdfpages/*.jpg'))
          for n in range(0,len(pages),3):
              names=pages[n:n+3]
              w=850; h=1120
              sheet=Image.new('RGB',(w*len(names),h),'white')
              draw=ImageDraw.Draw(sheet)
              for j,p in enumerate(names):
                  im=Image.open(p).convert("RGB")
                  im.thumbnail((w-24,h-60))
                  dx=j*w+(w-im.width)//2
                  dy=45
                  sheet.paste(im,(dx,dy))
                  draw.text((j*w+25,12),f"PAGE {n+j+1}", fill='black')
              import io
              b=io.BytesIO()
              sheet.save(b,format='JPEG',quality=62,optimize=True)
              print(f"SHEET_{n//3+1}="+base64.b64encode(b.getvalue()).decode())
          PY
